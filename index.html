<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Regressivo</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #ffffff;
      color: #37352F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .countdown-widget {
      width: 100%;
      max-width: 760px;
      padding: 22px 18px;
      text-align: center;
    }

    .trip-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9B6A1F;
      margin-bottom: 8px;
    }

    .trip-date {
      font-size: 1.45rem;
      font-weight: 750;
      line-height: 1.15;
      margin-bottom: 6px;
      letter-spacing: -0.03em;
    }

    .trip-details {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    #timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      text-align: center;
    }

    .time-block {
      padding: 14px 8px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      background: #fafafa;
    }

    .numeros {
      font-weight: 800;
      font-size: 2.35rem;
      line-height: 1;
      letter-spacing: -0.06em;
      margin-bottom: 8px;
    }

    .label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #666;
    }

    .ended {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      .countdown-widget {
        padding: 18px 12px;
      }

      .trip-date {
        font-size: 1.2rem;
      }

      .trip-details {
        font-size: 0.8rem;
        margin-bottom: 16px;
      }

      #timer {
        gap: 8px;
      }

      .time-block {
        padding: 12px 6px;
        border-radius: 12px;
      }

      .numeros {
        font-size: 1.75rem;
      }

      .label {
        font-size: 0.56rem;
        letter-spacing: 1.5px;
      }
    }
  </style>
</head>

<body>
  <div class="countdown-widget">
    <div class="trip-label">Próxima viagem</div>

    <div class="trip-date">
      Itália · 12 a 19 de abril de 2027
    </div>

    <div class="trip-details">
      6 noites de hospedagem + 1 noite de voo
    </div>

    <div id="timer">
      <div class="time-block">
        <div id="dias" class="numeros">--</div>
        <div class="label">dias</div>
      </div>

      <div class="time-block">
        <div id="horas" class="numeros">--</div>
        <div class="label">horas</div>
      </div>

      <div class="time-block">
        <div id="minutos" class="numeros">--</div>
        <div class="label">minutos</div>
      </div>

      <div class="time-block">
        <div id="segundos" class="numeros">--</div>
        <div class="label">segundos</div>
      </div>
    </div>

    <div id="ended-message" class="ended"></div>
  </div>

  <script>
    const minhaData = new Date('2027-04-12T00:00:00-03:00');
    const dataInicial = moment(minhaData);

    function padLeft(num) {
      return String(num).padStart(2, '0');
    }

    function updateTimer() {
      const hoje = moment();
      const diff = moment.duration(dataInicial.diff(hoje));

      if (diff.asSeconds() <= 0) {
        clearInterval(intervalId);

        document.getElementById("timer").style.display = "none";
        document.getElementById("ended-message").innerHTML = "A viagem começou! ✈️";

        confetti({
          particleCount: 140,
          spread: 90,
          origin: { y: 0.65 }
        });

        return;
      }

      const dias = padLeft(Math.floor(diff.asDays()));
      const horas = padLeft(Math.floor(diff.hours()));
      const minutos = padLeft(Math.floor(diff.minutes()));
      const segundos = padLeft(Math.floor(diff.seconds()));

      document.getElementById("dias").innerHTML = dias;
      document.getElementById("horas").innerHTML = horas;
      document.getElementById("minutos").innerHTML = minutos;
      document.getElementById("segundos").innerHTML = segundos;
    }

    updateTimer();

    const intervalId = setInterval(updateTimer, 1000);
  </script>
</body>
</html>
