<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Regressivo</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      color: #37352F;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .countdown-widget {
      width: 100%;
      max-width: 760px;
      padding: 18px 20px;
      text-align: center;
    }

    .trip-header {
      margin-bottom: 18px;
    }

    .trip-kicker {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.6px;
      color: #9B6A1F;
      margin-bottom: 6px;
    }

    .trip-date {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.04em;
      color: #37352F;
      margin-bottom: 5px;
    }

    .trip-details {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.25;
    }

    #timer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 28px;
      padding-top: 18px;
      border-top: 1px solid #eeeeee;
      text-transform: uppercase;
    }

    .time-block {
      text-align: center;
      min-width: 68px;
    }

    .numeros {
      font-weight: 800;
      font-size: 2.85rem;
      line-height: 0.95;
      letter-spacing: -0.08em;
      color: #37352F;
      margin-bottom: 8px;
    }

    .label {
      font-size: 0.66rem;
      font-weight: 700;
      color: #666;
      letter-spacing: 3px;
    }

    .ended {
      display: none;
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #eeeeee;
    }

    @media (max-width: 700px) {
      .countdown-widget {
        padding: 16px 12px;
      }

      .trip-kicker {
        font-size: 0.7rem;
        letter-spacing: 2px;
      }

      .trip-date {
        font-size: 1.12rem;
      }

      .trip-details {
        font-size: 0.78rem;
      }

      #timer {
        gap: 16px;
        padding-top: 16px;
      }

      .time-block {
        min-width: 52px;
      }

      .numeros {
        font-size: 2.1rem;
      }

      .label {
        font-size: 0.55rem;
        letter-spacing: 2px;
      }
    }

    @media (max-width: 430px) {
      #timer {
        gap: 10px;
      }

      .time-block {
        min-width: 44px;
      }

      .numeros {
        font-size: 1.75rem;
      }

      .label {
        font-size: 0.5rem;
        letter-spacing: 1.4px;
      }
    }
  </style>
</head>

<body>
  <div class="countdown-widget">
    <div class="trip-header">
      <div class="trip-kicker">Próxima viagem · Itália</div>

      <div class="trip-date">
        12 a 19 de abril de 2027
      </div>

      <div class="trip-details">
        6 noites de hospedagem + 1 noite de voo
      </div>
    </div>

    <div id="timer">
      <div class="time-block">
        <div id="dias" class="numeros">--</div>
        <div class="label">dias</div>
      </div>

      <div class="time-block">
        <div id="horas" class="numeros">--</div>
        <div class="label">horas</div>
      </div>

      <div class="time-block">
        <div id="minutos" class="numeros">--</div>
        <div class="label">min</div>
      </div>

      <div class="time-block">
        <div id="segundos" class="numeros">--</div>
        <div class="label">seg</div>
      </div>
    </div>

    <div id="ended-message" class="ended"></div>
  </div>

  <script>
    const minhaData = new Date('2027-04-12T00:00:00-03:00');
    const dataInicial = moment(minhaData);

    function padLeft(num) {
      return String(num).padStart(2, '0');
    }

    function updateTimer() {
      const hoje = moment();
      const diff = moment.duration(dataInicial.diff(hoje));

      if (diff.asSeconds() <= 0) {
        clearInterval(intervalId);

        document.getElementById("timer").style.display = "none";
        const endedMessage = document.getElementById("ended-message");
        endedMessage.style.display = "block";
        endedMessage.innerHTML = "A viagem começou! ✈️";

        confetti({
          particleCount: 140,
          spread: 90,
          origin: { y: 0.65 }
        });

        return;
      }

      document.getElementById("dias").innerHTML = padLeft(Math.floor(diff.asDays()));
      document.getElementById("horas").innerHTML = padLeft(Math.floor(diff.hours()));
      document.getElementById("minutos").innerHTML = padLeft(Math.floor(diff.minutes()));
      document.getElementById("segundos").innerHTML = padLeft(Math.floor(diff.seconds()));
    }

    updateTimer();

    const intervalId = setInterval(updateTimer, 1000);
  </script>
</body>
</html>
